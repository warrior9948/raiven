<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raiven — Security Core</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            background: #080b12;
            color: #edf2f7;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            color: #8994a8;
            margin-top: 5px;
        }

        .card {
            background: #111722;
            border: 1px solid #273044;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .security-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .active {
            color: #52d68a;
            font-weight: bold;
        }

        .request-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 8px 0;
            color: #aeb8c9;
        }

        .value {
            color: #edf2f7;
            text-align: right;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .allow {
            background: #287a4c;
        }

        .deny {
            background: #8d3540;
        }

        .test {
            background: #315a91;
        }

        .stop {
            background: #6b1f27;
        }

        button:active {
            transform: scale(0.98);
        }

        #result {
            display: none;
            padding: 14px;
            border-radius: 10px;
            background: #0b1019;
            margin-top: 15px;
            line-height: 1.5;
        }

        .log {
            font-family: monospace;
            font-size: 13px;
            color: #9ca8bb;
            white-space: pre-wrap;
        }

    </style>

</head>

<body>

<div class="container">

    <header>

        <h1>RAIVEN</h1>

        <div class="subtitle">
            Security Core v0.1
        </div>

    </header>


    <!-- SECURITY STATUS -->

    <div class="card security-status">

        <strong>
            Security Core
        </strong>

        <span
            id="securityStatus"
            class="active"
        >
            ACTIVE
        </span>

    </div>


    <!-- PROTECTED ACTION REQUEST -->

    <div class="card">

        <div class="request-title">
            Protected Action Request
        </div>


        <div class="row">

            <span>
                Action
            </span>

            <span class="value">
                Access Camera
            </span>

        </div>


        <div class="row">

            <span>
                Permission
            </span>

            <span class="value">
                CAMERA
            </span>

        </div>


        <div class="row">

            <span>
                Risk
            </span>

            <span
                id="riskLevel"
                class="value"
            >
                NOT EVALUATED
            </span>

        </div>


        <div class="row">

            <span>
                Risk Score
            </span>

            <span
                id="riskScore"
                class="value"
            >
                —
            </span>

        </div>


        <div class="row">

            <span>
                Scope
            </span>

            <span class="value">
                ONCE
            </span>

        </div>


        <button
            id="allowButton"
            class="allow"
        >
            ALLOW ONCE
        </button>


        <button
            id="denyButton"
            class="deny"
        >
            DENY
        </button>


        <button
            id="testActionButton"
            class="test"
        >
            TEST PROTECTED ACTION
        </button>

    </div>


    <!-- EMERGENCY STOP -->

    <div class="card">

        <strong>
            Emergency Control
        </strong>


        <button
            id="stopButton"
            class="stop"
        >
            EMERGENCY STOP
        </button>

    </div>


    <!-- RESULT -->

    <div id="result"></div>


    <!-- SECURITY LOG -->

    <div class="card">

        <strong>
            Security Log
        </strong>


        <div
            id="log"
            class="log"
        >
            No security events yet.
        </div>

    </div>

</div>


<!-- ==================================================
     RAIVEN SECURITY CORE
================================================== -->

<script type="module">


    // --------------------------------------------------
    // SECURITY MODULES
    // --------------------------------------------------

    import {
        PermissionManager
    }
    from "./js/security/PermissionManager.js";


    import {
        ActionGuard
    }
    from "./js/security/ActionGuard.js";


    import {
        RiskEngine
    }
    from "./js/security/RiskEngine.js";


    /*
    ====================================================
    RAIVEN SECURITY CORE

    SECURITY PIPELINE

    User Request
          ↓
    Risk Engine
          ↓
    Permission Manager
          ↓
    Action Guard
          ↓
    Protected Action
          ↓
    Permission Consumption
          ↓
    Security Log
    ====================================================
    */


    // --------------------------------------------------
    // SECURITY STATE
    // --------------------------------------------------

    const SecurityState = {

        active: true,

        emergencyStopped: false,

        logs: []

    };


    // --------------------------------------------------
    // LOGGING
    // --------------------------------------------------

    function securityLog(event) {

        const timestamp =
            new Date().toISOString();


        SecurityState.logs.push({

            time: timestamp,

            event: event

        });


        updateLog();

    }


    function updateLog() {

        const logElement =
            document.getElementById("log");


        if (
            SecurityState.logs.length === 0
        ) {

            logElement.textContent =
                "No security events yet.";

            return;

        }


        logElement.textContent =

            SecurityState.logs

            .map(item =>
                `[${item.time}] ${item.event}`
            )

            .join("\n");

    }


    // --------------------------------------------------
    // RESULT DISPLAY
    // --------------------------------------------------

    function showResult(message) {

        const result =
            document.getElementById("result");


        result.style.display =
            "block";


        result.textContent =
            message;

    }


    // --------------------------------------------------
    // DOM REFERENCES
    // --------------------------------------------------

    const securityStatus =
        document.getElementById(
            "securityStatus"
        );


    const riskLevel =
        document.getElementById(
            "riskLevel"
        );


    const riskScore =
        document.getElementById(
            "riskScore"
        );


    const allowButton =
        document.getElementById(
            "allowButton"
        );


    const denyButton =
        document.getElementById(
            "denyButton"
        );


    const testActionButton =
        document.getElementById(
            "testActionButton"
        );


    const stopButton =
        document.getElementById(
            "stopButton"
        );


    // --------------------------------------------------
    // SECURITY MODULES
    // --------------------------------------------------

    const permissionManager =
        new PermissionManager();


    const riskEngine =
        new RiskEngine();


    const actionGuard =
        new ActionGuard(
            permissionManager,
            SecurityState,
            securityLog
        );


    // --------------------------------------------------
    // PROTECTED ACTION DEFINITION
    // --------------------------------------------------

    const cameraAction = {

        name: "CAMERA_ACCESS_TEST",

        permission: "CAMERA",

        dataSensitivity: "PRIVATE",

        externalEffect: "DEVICE",

        reversibility: "REVERSIBLE",

        userImpact: "MEDIUM",

        scope: "ONCE"

    };


    // --------------------------------------------------
    // RISK EVALUATION
    // --------------------------------------------------

    function evaluateCameraRisk() {

        const evaluation =
            riskEngine.evaluate(
                cameraAction
            );


        if (!evaluation.allowed) {

            riskLevel.textContent =
                evaluation.riskLevel;

            riskScore.textContent =
                "INVALID";

            securityLog(
                `RISK EVALUATION FAILED: ${evaluation.reason}`
            );


            return evaluation;

        }


        riskLevel.textContent =
            evaluation.riskLevel;


        riskScore.textContent =
            evaluation.riskScore;


        securityLog(
            `RISK EVALUATED: ${evaluation.action} — ${evaluation.riskLevel} — Score ${evaluation.riskScore}`
        );


        securityLog(
            `Confirmation required: ${evaluation.requirements.requiresConfirmation}`
        );


        securityLog(
            `Explicit confirmation required: ${evaluation.requirements.requiresExplicitConfirmation}`
        );


        securityLog(
            `Additional authentication required: ${evaluation.requirements.requiresAdditionalAuthentication}`
        );


        return evaluation;

    }


    // --------------------------------------------------
    // REQUEST PERMISSION
    // --------------------------------------------------

    function requestPermission() {

        securityLog(
            "Permission requested: CAMERA"
        );


        // ----------------------------------------------
        // EMERGENCY STOP
        // ----------------------------------------------

        if (
            SecurityState.emergencyStopped
        ) {

            showResult(
                "BLOCKED: Emergency STOP is active."
            );


            securityLog(
                "CAMERA request blocked by Emergency STOP."
            );


            return;

        }


        // ----------------------------------------------
        // SECURITY CORE
        // ----------------------------------------------

        if (
            !SecurityState.active
        ) {

            showResult(
                "BLOCKED: Security Core is inactive."
            );


            securityLog(
                "CAMERA request blocked because Security Core is inactive."
            );


            return;

        }


        // ----------------------------------------------
        // RISK EVALUATION
        // ----------------------------------------------

        const evaluation =
            evaluateCameraRisk();


        if (
            !evaluation.allowed
        ) {

            showResult(
                "BLOCKED: Risk evaluation failed."
            );


            return;

        }


        /*
        ------------------------------------------------
        USER APPROVAL

        Risk Engine has evaluated the action.

        It does NOT grant permission.

        The user must still explicitly approve.
        ------------------------------------------------
        */

        const request =
            permissionManager.request(
                "CAMERA",
                "ONCE"
            );


        securityLog(
            `Permission request created: ${request.permission} — ${request.scope}`
        );


        permissionManager.grant(
            "CAMERA",
            "ONCE"
        );


        showResult(
            `PERMISSION GRANTED: CAMERA — ONCE | RISK: ${evaluation.riskLevel}`
        );


        securityLog(
            "CAMERA permission granted by user."
        );

    }


    // --------------------------------------------------
    // DENY PERMISSION
    // --------------------------------------------------

    function denyPermission() {

        permissionManager.deny(
            "CAMERA"
        );


        showResult(
            "ACCESS BLOCKED: CAMERA permission denied."
        );


        securityLog(
            "CAMERA permission denied by user."
        );

    }


    // --------------------------------------------------
    // TEST PROTECTED ACTION
    // --------------------------------------------------

    function testProtectedAction() {

        securityLog(
            "Protected action requested: CAMERA_ACCESS_TEST"
        );


        // ----------------------------------------------
        // RISK EVALUATION
        // ----------------------------------------------

        const evaluation =
            evaluateCameraRisk();


        if (
            !evaluation.allowed
        ) {

            showResult(
                "ACTION BLOCKED: RISK_EVALUATION_FAILED"
            );


            return;

        }


        // ----------------------------------------------
        // ACTION GUARD
        // ----------------------------------------------

        const result =
            actionGuard.execute(

                "CAMERA",

                "CAMERA_ACCESS_TEST",

                () => {

                    /*
                    ------------------------------------
                    SIMULATED ACTION

                    This does NOT access the real camera.
                    ------------------------------------
                    */

                    return "SIMULATED_CAMERA_ACCESS";

                }

            );


        // ----------------------------------------------
        // ACTION BLOCKED
        // ----------------------------------------------

        if (
            !result.allowed
        ) {

            showResult(
                `ACTION BLOCKED: ${result.reason}`
            );


            return;

        }


        // ----------------------------------------------
        // ACTION EXECUTED
        // ----------------------------------------------

        if (
            result.executed
        ) {

            showResult(
                `PROTECTED ACTION EXECUTED AND PERMISSION CONSUMED. RISK: ${evaluation.riskLevel}`
            );


            return;

        }


        // ----------------------------------------------
        // EXECUTION FAILURE
        // ----------------------------------------------

        showResult(
            `ACTION FAILED: ${result.reason}`
        );

    }


    // --------------------------------------------------
    // EMERGENCY STOP
    // --------------------------------------------------

    function emergencyStop() {

        SecurityState.emergencyStopped =
            true;


        /*
        Remove every active permission.
        */

        permissionManager.clearAll();


        securityStatus.textContent =
            "EMERGENCY STOP";


        securityStatus.className =
            "";


        showResult(
            "ALL PROTECTED ACTIONS BLOCKED."
        );


        securityLog(
            "EMERGENCY STOP ACTIVATED."
        );

    }


    // --------------------------------------------------
    // BUTTON EVENTS
    // --------------------------------------------------

    allowButton.addEventListener(
        "click",
        requestPermission
    );


    denyButton.addEventListener(
        "click",
        denyPermission
    );


    testActionButton.addEventListener(
        "click",
        testProtectedAction
    );


    stopButton.addEventListener(
        "click",
        emergencyStop
    );


    // --------------------------------------------------
    // INITIALIZATION
    // --------------------------------------------------

    securityLog(
        "Security Core initialized."
    );


    securityLog(
        "Permission Manager initialized."
    );


    securityLog(
        "Action Guard initialized."
    );


    securityLog(
        "Risk Engine initialized."
    );


    // Evaluate the protected action at startup.

    evaluateCameraRisk();


</script>

</body>
</html>
